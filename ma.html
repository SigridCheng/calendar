
<!DOCTYPE html>
<html>
<head>
    <title>Monthly Calendar with Chinese Holidays</title>
    <meta charset="UTF-8">
    <style>
        .calendar-container {
            max-width: 440px;
            margin: 15px auto;
            font-family: Arial, sans-serif;
            font-size: 10px;
        }

        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
        }

        select {
            font-size: 10px;
            padding: 2px;
        }

        .month-display {
            font-weight: bold;
            font-size: 1.5em;
            text-align: center;
            line-height: 32px;
            height: 32px;
            margin: 0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr) 36px;
            gap: 1px;
        }

        .calendar-header {
            padding: 3px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #ccc;
            font-size: 10px;
        }

        .calendar-day {
            padding: 2px;
            text-align: center;
            border: 1px solid #ccc;
            min-height: 38px;
            line-height: 1.1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            position: relative;
        }

        .day-number {
            font-size: 13px;
            margin-bottom: 1px;
        }

        .lunar-date {
            font-size: 9px;
            color: #666;
            margin-bottom: 0px;
        }

        .holiday-label {
            font-size: 9px;
            color: #ff4444;
            font-weight: bold;
            margin-top: 0px;
        }

        .solar-term {
            font-size: 9px;
            color: #2196F3;
            font-weight: bold;
            margin-top: 0px;
        }

        .work-badge {
            position: absolute;
            top: 1px;
            right: 1px;
            background-color: #ff9800;
            color: white;
            font-size: 9px;
            padding: 0px 2px;
            border-radius: 2px;
            font-weight: bold;
        }

        .rest-badge {
            position: absolute;
            top: 1px;
            right: 1px;
            background-color: #4CAF50;
            color: white;
            font-size: 9px;
            padding: 0px 2px;
            border-radius: 2px;
            font-weight: bold;
        }

        .past-day {
            text-decoration: line-through;
            color: #999;
        }

        .other-month {
            color: #ccc;
        }

        .today {
            font-weight: bold;
            background-color: #fffacd !important;
        }

        .weekend {
            background-color: #fff0f0;
        }

        .embed-button {
            padding: 4px 8px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin: 4px;
            font-size: 10px;
        }

        .arrow {
            font-size: 14px;
            cursor: pointer;
            user-select: none;
            /*padding: 5px;*/
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            margin: 0 4px;
        }

        .arrow:hover {
            background-color: #e0e0e0;
        }

        #calendar-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom:-20px;
            height: 32px;
        }

        .hidden {
            display: none;
        }

        .week-display {
            font-size: 11px;
            text-align: center;
            padding: 3px;
            border: 1px solid #ccc;
            min-height: 38px;
            line-height: 14px;
        }

        .legend {
            margin: 12px auto;
            max-width: 440px;
            display: flex;
            gap: 12px;
            justify-content: center;
            font-size: 9px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
<div class="calendar-container">
    <div id="initial-controls" class="controls">
        <select id="startDay">
            <option value="0">Start from Sunday</option>
            <option value="1">Start from Monday</option>
        </select>
        <select id="background">
            <option value="#ffffff">White Grid</option>
            <option value="#f0f8ff">Light Blue Grid</option>
            <option value="#f5f5dc">Beige Grid</option>
            <option value="#e6ffe6">Light Green Grid</option>
            <option value="#e6e6fa">Light Purple Grid</option>
        </select>
        <button id="embedButton" class="embed-button">Embed</button>
    </div>

    <div class="month-display"></div>
    <div id="calendar-controls" class="controls">
        <span id="arrowLeft" class="arrow prev" style="position: relative; left:-50px; top: -33px; height: 20px">&lt;</span>
        <!--        // <span style="min-width: 160px; text-align: center; height: 20px;"></span>-->
        <span class="arrow next" style="position: relative; right:-50px; top: -35px; height: 20px">&gt;</span>
    </div>

    <div id="calendar"></div>
</div>

<div class="legend">
    <div class="legend-item">
        <span class="legend-color" style="background-color: #ff4444;"></span>
        <span>节假日</span>
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background-color: #2196F3;"></span>
        <span>节气</span>
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background-color: #4CAF50;"></span>
        <span>休</span>
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background-color: #ff9800;"></span>
        <span>班</span>
    </div>
    <div class="legend-item">
        <span class="legend-color" style="background-color: #fff0f0;"></span>
        <span>周末</span>
    </div>
</div>

<script>
    // 农历计算
    const lunarInfo = [0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5d0,0x14573,0x052d0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b5a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04bd7,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0];
    const nStr1 = ["日","一","二","三","四","五","六","七","八","九","十"];
    const nStr2 = ["初","十","廿","卅"];
    const monthCn = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];

    function lYearDays(y) {
        let sum = 348;
        for(let i = 0x8000; i > 0x8; i >>= 1) sum += (lunarInfo[y-1900] & i)? 1 : 0;
        return sum + leapDays(y);
    }

    function leapDays(y) {
        if(leapMonth(y)) return (lunarInfo[y-1900] & 0x10000)? 30 : 29;
        return 0;
    }

    function leapMonth(y) {
        return lunarInfo[y-1900] & 0xf;
    }

    function monthDays(y,m) {
        return (lunarInfo[y-1900] & (0x10000>>m))? 30 : 29;
    }

    function toLunar(date) {
        let i, leap = 0, temp = 0;
        let year = date.getFullYear();
        let month = date.getMonth() + 1;
        let day = date.getDate();

        let offset = Math.floor((Date.UTC(year, month-1, day) - Date.UTC(1900, 0, 31))/86400000);

        for(i = 1900; i < 2100 && offset > 0; i++) {
            temp = lYearDays(i);
            offset -= temp;
        }

        if(offset < 0) {
            offset += temp;
            i--;
        }

        let lunarYear = i;
        leap = leapMonth(i);
        let isLeap = false;

        for(i = 1; i < 13 && offset > 0; i++) {
            if(leap > 0 && i == (leap+1) && isLeap == false) {
                --i;
                isLeap = true;
                temp = leapDays(lunarYear);
            } else {
                temp = monthDays(lunarYear, i);
            }

            if(isLeap == true && i == (leap+1)) isLeap = false;
            offset -= temp;
        }

        if(offset == 0 && leap > 0 && i == leap+1) {
            if(isLeap) {
                isLeap = false;
            } else {
                isLeap = true;
                --i;
            }
        }

        if(offset < 0) {
            offset += temp;
            --i;
        }

        let lunarMonth = i;
        let lunarDay = offset + 1;

        return {
            year: lunarYear,
            month: lunarMonth,
            day: lunarDay,
            isLeap: isLeap
        };
    }

    function getLunarDayString(day) {
        if(day == 10) return "初十";
        if(day == 20) return "二十";
        if(day == 30) return "三十";
        return nStr2[Math.floor(day/10)] + nStr1[day%10];
    }

    function getLunarDateString(date) {
        let lunar = toLunar(date);
        if(lunar.day == 1) {
            return (lunar.isLeap ? "闰" : "") + monthCn[lunar.month-1] + "月";
        }
        return getLunarDayString(lunar.day);
    }

    // 中国节假日数据
    const chineseHolidays = {
        '1-1': '元旦',
        '2-14': '情人节',
        '3-8': '妇女节',
        '3-12': '植树节',
        '5-1': '劳动节',
        '5-4': '青年节',
        '6-1': '儿童节',
        '7-1': '建党节',
        '8-1': '建军节',
        '9-10': '教师节',
        '10-1': '国庆节'
    };

    // 2025年节气数据
    const solarTerms2025 = {
        '1-5': '小寒', '1-20': '大寒',
        '2-3': '立春', '2-18': '雨水',
        '3-5': '惊蛰', '3-20': '春分',
        '4-4': '清明', '4-20': '谷雨',
        '5-5': '立夏', '5-21': '小满',
        '6-5': '芒种', '6-21': '夏至',
        '7-7': '小暑', '7-22': '大暑',
        '8-7': '立秋', '8-23': '处暑',
        '9-7': '白露', '9-23': '秋分',
        '10-8': '寒露', '10-23': '霜降',
        '11-7': '立冬', '11-22': '小雪',
        '12-7': '大雪', '12-21': '冬至'
    };

    // 2026年节气数据
    const solarTerms2026 = {
        '1-5': '小寒', '1-20': '大寒',
        '2-4': '立春', '2-19': '雨水',
        '3-6': '惊蛰', '3-21': '春分',
        '4-5': '清明', '4-20': '谷雨',
        '5-6': '立夏', '5-21': '小满',
        '6-6': '芒种', '6-21': '夏至',
        '7-7': '小暑', '7-23': '大暑',
        '8-8': '立秋', '8-23': '处暑',
        '9-8': '白露', '9-23': '秋分',
        '10-8': '寒露', '10-24': '霜降',
        '11-7': '立冬', '11-22': '小雪',
        '12-7': '大雪', '12-22': '冬至'
    };

    const solarTermsByYear = {
        2025: solarTerms2025,
        2026: solarTerms2026
    };

    // 2025年调休安排
    const workdayAdjustments2025 = {
        '1-26': 'work',
        '1-28': 'rest',
        '1-29': 'rest',
        '1-30': 'rest',
        '1-31': 'rest',
        '2-1': 'rest',
        '2-2': 'rest',
        '2-4': 'rest',
        '4-4': 'rest',
        '4-5': 'rest',
        '4-6': 'rest',
        '4-27': 'work',
        '5-1': 'rest',
        '5-2': 'rest',
        '5-3': 'rest',
        '5-4': 'rest',
        '5-5': 'rest',
        '5-31': 'rest',
        '6-1': 'rest',
        '6-2': 'rest',
        '9-28': 'work',
        '10-1': 'rest',
        '10-2': 'rest',
        '10-3': 'rest',
        '10-4': 'rest',
        '10-5': 'rest',
        '10-6': 'rest',
        '10-7': 'rest',
        '10-8': 'rest',
        '10-11': 'work'
    };

    // 2026年调休安排
    const workdayAdjustments2026 = {
        '1-1': 'rest',
        '1-2': 'rest',
        '1-3': 'rest',
        '1-4': 'work',
        '2-14': 'work',
        '2-15': 'rest',
        '2-16': 'rest',
        '2-17': 'rest',
        '2-18': 'rest',
        '2-19': 'rest',
        '2-20': 'rest',
        '2-21': 'rest',
        '2-22': 'rest',
        '2-23': 'rest',
        '2-28': 'work',
        '4-4': 'rest',
        '4-5': 'rest',
        '4-6': 'rest',
        '5-1': 'rest',
        '5-2': 'rest',
        '5-3': 'rest',
        '5-4': 'rest',
        '5-5': 'rest',
        '5-9': 'work',
        '6-19': 'rest',
        '6-20': 'rest',
        '6-21': 'rest',
        '9-20': 'work',
        '9-25': 'rest',
        '9-26': 'rest',
        '9-27': 'rest',
        '10-1': 'rest',
        '10-2': 'rest',
        '10-3': 'rest',
        '10-4': 'rest',
        '10-5': 'rest',
        '10-6': 'rest',
        '10-7': 'rest',
        '10-10': 'work'
    };

    const workdayAdjustmentsByYear = {
        2025: workdayAdjustments2025,
        2026: workdayAdjustments2026
    };

    document.addEventListener("DOMContentLoaded", () => {
        const calendar = document.getElementById("calendar");
        const startDaySelect = document.getElementById("startDay");
        const backgroundSelect = document.getElementById("background");
        const embedButton = document.getElementById("embedButton");
        const initialControls = document.getElementById("initial-controls");
        const monthDisplay = document.querySelector(".month-display");

        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        function getWeekNumber(date) {
            const firstDayOfYear = new Date(date.getFullYear(), 0, 1);
            const pastDaysOfYear = (date - firstDayOfYear) / 86400000;
            return Math.ceil((pastDaysOfYear + firstDayOfYear.getDay() + 1) / 7);
        }

        function applyGridColor() {
            const gridColor = backgroundSelect.value;
            document.querySelectorAll('.calendar-day, .calendar-header, .week-display').forEach(el => {
                if (!el.classList.contains('today') && !el.classList.contains('weekend')) {
                    el.style.backgroundColor = gridColor;
                }
            });
        }

        function getHolidayForDate(month, day) {
            const key = `${month + 1}-${day}`;
            return chineseHolidays[key] || null;
        }

        function getSolarTermForDate(year, month, day) {
            const key = `${month + 1}-${day}`;
            const yearTerms = solarTermsByYear[year];
            return yearTerms ? yearTerms[key] || null : null;
        }

        function getWorkdayAdjustment(year, month, day) {
            const key = `${month + 1}-${day}`;
            const yearAdjustments = workdayAdjustmentsByYear[year];
            return yearAdjustments ? yearAdjustments[key] || null : null;
        }

        function generateCalendar() {
            const startDay = parseInt(startDaySelect.value);
            const today = new Date();
            const date = new Date(currentYear, currentMonth, 1);
            const monthNames = ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];

            monthDisplay.textContent = `${monthNames[currentMonth]} ${currentYear}`;

            let calendarHTML = '<div class="calendar-grid">';

            const days = startDay === 0
                ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
                : ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

            days.forEach(day => {
                calendarHTML += `<div class="calendar-header">${day}</div>`;
            });

            calendarHTML += '<div class="calendar-header">Week</div>';

            let firstDay = date.getDay();
            if (startDay === 1) {
                firstDay = firstDay === 0 ? 6 : firstDay - 1;
            }

            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
            const prevMonthLastDay = new Date(currentYear, currentMonth, 0).getDate();

            let dayCount = 1;
            let nextMonthDay = 1;
            const totalDays = firstDay + lastDay;
            const totalRows = Math.ceil(totalDays / 7);

            for (let row = 0; row < totalRows; row++) {
                for (let col = 0; col < 7; col++) {
                    const dayPosition = row * 7 + col;
                    const dayIndex = dayPosition - firstDay;

                    if (dayIndex < 0) {
                        const prevDay = prevMonthLastDay + dayIndex + 1;
                        calendarHTML += `<div class="calendar-day other-month"><span class="day-number">${prevDay}</span></div>`;
                    } else if (dayIndex >= lastDay) {
                        calendarHTML += `<div class="calendar-day other-month"><span class="day-number">${nextMonthDay++}</span></div>`;
                    } else {
                        const currentDate = dayIndex + 1;
                        const currentDateObj = new Date(currentYear, currentMonth, currentDate);
                        const dayOfWeek = currentDateObj.getDay();
                        const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

                        const isToday = currentDate === today.getDate() &&
                            currentMonth === today.getMonth() &&
                            currentYear === today.getFullYear();
                        const isPast = new Date(currentYear, currentMonth, currentDate) < new Date(today.getFullYear(), today.getMonth(), today.getDate());

                        const holiday = getHolidayForDate(currentMonth, currentDate);
                        const solarTerm = getSolarTermForDate(currentYear, currentMonth, currentDate);
                        const workdayAdj = getWorkdayAdjustment(currentYear, currentMonth, currentDate);
                        const lunarDate = getLunarDateString(currentDateObj);

                        let dayClass = 'calendar-day';
                        if (isToday) dayClass += ' today';
                        if (isPast) dayClass += ' past-day';
                        if (isWeekend && !workdayAdj) dayClass += ' weekend';

                        calendarHTML += `<div class="${dayClass}">`;

                        if(workdayAdj === 'work') {
                            calendarHTML += '<span class="work-badge">班</span>';
                        } else if(workdayAdj === 'rest') {
                            calendarHTML += '<span class="rest-badge">休</span>';
                        }

                        calendarHTML += `<span class="day-number">${currentDate}</span>
                                <span class="lunar-date">${lunarDate}</span>`;

                        if (holiday) {
                            calendarHTML += `<span class="holiday-label">${holiday}</span>`;
                        }
                        if (solarTerm) {
                            calendarHTML += `<span class="solar-term">${solarTerm}</span>`;
                        }

                        calendarHTML += '</div>';
                    }
                }

                const weekDate = new Date(currentYear, currentMonth, dayCount - firstDay + (row * 7));
                const weekNum = getWeekNumber(weekDate);
                calendarHTML += `<div class="week-display">${weekNum}</div>`;
            }

            calendarHTML += '</div>';
            calendar.innerHTML = calendarHTML;
            applyGridColor();
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            generateCalendar();
            updateURL();
        }

        function updateURL() {
            try {
                const url = new URL(window.location.href);
                url.searchParams.set('startDay', startDaySelect.value);
                url.searchParams.set('background', backgroundSelect.value);
                url.searchParams.set('month', currentMonth);
                url.searchParams.set('year', currentYear);
                window.history.pushState({}, '', url.toString());
            } catch (e) {
                // 在某些环境下（如iframe）无法使用pushState，忽略错误
                console.log('URL update skipped');
            }
        }

        embedButton.addEventListener("click", () => {
            try {
                const embedUrl = window.location.href;
                navigator.clipboard.writeText(embedUrl).then(() => {
                    initialControls.classList.add("hidden");
                    updateURL();
                    alert('链接已复制到剪贴板！');
                });
            } catch (e) {
                initialControls.classList.add("hidden");
                alert('设置已保存！');
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('startDay') && urlParams.has('background')) {
            startDaySelect.value = urlParams.get('startDay');
            backgroundSelect.value = urlParams.get('background');
            currentMonth = parseInt(urlParams.get('month')) || currentMonth;
            currentYear = parseInt(urlParams.get('year')) || currentYear;

            initialControls.classList.add("hidden");
        }

        document.querySelector(".prev").addEventListener("click", () => changeMonth(-1));
        document.querySelector(".next").addEventListener("click", () => changeMonth(1));

        generateCalendar();

        startDaySelect.addEventListener("change", generateCalendar);
        backgroundSelect.addEventListener("change", generateCalendar);
    });
</script>
</body>
</html>
