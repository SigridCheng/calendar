<!DOCTYPE html>
<html>
<head>
    <title>固定当前月-全功能日历</title>
    <meta charset="UTF-8">
    <style>
        .calendar-container {
            max-width: 440px;
            margin: 15px auto;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            font-size: 10px;
        }

        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
        }

        select { font-size: 10px; padding: 2px; }

        .month-display {
            font-weight: bold;
            font-size: 1.5em;
            text-align: center;
            line-height: 32px;
            height: 32px;
            margin: 0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr) 36px;
            gap: 1px;
        }

        .calendar-header {
            padding: 3px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #ccc;
            font-size: 10px;
        }

        .calendar-day {
            padding: 2px;
            text-align: center;
            border: 1px solid #ccc;
            min-height: 42px;
            line-height: 1.1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            position: relative;
        }

        .day-number { font-size: 13px; margin-bottom: 1px; }
        .lunar-date { font-size: 9px; color: #666; }
        .holiday-label { font-size: 9px; color: #ff4444; font-weight: bold; }
        .solar-term { font-size: 9px; color: #2196F3; font-weight: bold; }

        .work-badge {
            position: absolute; top: 1px; right: 1px;
            background-color: #ff9800; color: white;
            font-size: 8px; padding: 0px 2px; border-radius: 2px; font-weight: bold;
        }

        .rest-badge {
            position: absolute; top: 1px; right: 1px;
            background-color: #4CAF50; color: white;
            font-size: 8px; padding: 0px 2px; border-radius: 2px; font-weight: bold;
        }

        .birthday-icon {
            position: absolute; bottom: 3px; left: 3px;
            font-size: 18px;
            cursor: help;
        }

        .past-day { text-decoration: line-through; color: #bbb; }
        .other-month { color: #ccc; opacity: 0.5; }
        .today { font-weight: bold; background-color: #fffacd !important; border: 1px solid #ff9800; }
        .weekend { background-color: #fff0f0; }

        .embed-button {
            padding: 4px 8px; background-color: #4CAF50; color: white;
            border: none; border-radius: 3px; cursor: pointer; margin: 4px; font-size: 10px;
        }

        .arrow {
            font-size: 14px; cursor: pointer; user-select: none;
            border-radius: 50%; width: 22px; height: 22px;
            display: inline-flex; align-items: center; justify-content: center;
            background-color: #f0f0f0;
        }

        #calendar-controls {
            display: flex; justify-content: center; align-items: center;
            gap: 100px; margin-top: -30px; margin-bottom: 10px;
        }

        .hidden { display: none; }

        .week-display {
            font-size: 11px; text-align: center; padding: 3px;
            border: 1px solid #ccc; line-height: 38px; color: #999;
        }

        .legend {
            margin: 15px auto; max-width: 440px; display: flex;
            gap: 12px; justify-content: center; font-size: 9px; flex-wrap: wrap;
        }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .legend-color { width: 10px; height: 10px; border-radius: 2px; }
    </style>
</head>
<body>

<div class="calendar-container">
    <div id="initial-controls" class="controls">
        <select id="startDay">
            <option value="0">Start from Sunday</option>
            <option value="1">Start from Monday</option>
        </select>
        <select id="background">
            <option value="#ffffff">White</option>
            <option value="#f0f8ff">Light Blue</option>
            <option value="#f5f5dc">Beige Grid</option>
            <option value="#e6ffe6">Light Green格</option>
            <option value="#e6e6fa">Light Purple格</option>
        </select>
        <button id="embedButton" class="embed-button">Embed</button>
    </div>

    <div class="month-display"></div>
    <div id="calendar-controls">
        <span class="arrow prev" style="position: relative; left:-50px;">&lt;</span>
        <span class="arrow next" style="position: relative; right:-50px;">&gt;</span>
    </div>

    <div id="calendar"></div>
</div>


<script>
    // ================= 配置区 =================
    const customData = {
        holidays: {
            '1-26': '腊八节',
            '2-10': '小年',
            '2-16': '除夕',
            '2-17': '春节',
            '3-20': '龙抬头', '3-3': '元宵节',
            '5-10':'母亲节',
            '6-19':'端午节',
            '8-19':'七夕节',
            '9-25':'中秋节',
            '10-19':'重阳节',
            '11-1':'万圣节🎃','11-26':'感恩节',
            '12-24':'平安夜','12-25':'圣诞节🎄',
        },
        birthdays: {
            '5-19': 'My',
            '3-15': 'My',
            '5-26': 'My',
            '5-22': 'My',
            '10-4': 'My',
        }
    };

    // 农历核心数据与逻辑
    const lunarInfo = [0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,0x06ca0,0x0b550,0x15355,0x04da0,0x0a5d0,0x14573,0x052d0,0x0a9a8,0x0e950,0x06aa0,0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b5a0,0x195a6,0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,0x05aa0,0x076a3,0x096d0,0x04bd7,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0];
    const monthCn = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
    const nStr1 = ["日","一","二","三","四","五","六","七","八","九","十"];

    function getLunar(date) {
        let i, leap=0, temp=0, offset = Math.floor((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - Date.UTC(1900,0,31))/86400000);
        for(i=1900; i<2100 && offset>0; i++) {
            temp = 348; for(let j=0x8000; j>0x8; j>>=1) temp += (lunarInfo[i-1900] & j)? 1:0;
            let lv = lunarInfo[i-1900] & 0xf; temp += (lv ? (lunarInfo[i-1900] & 0x10000 ? 30 : 29) : 0);
            offset -= temp;
        }
        if(offset<0) { offset += temp; i--; }
        let lYear = i, lLeap = lunarInfo[i-1900] & 0xf, lIsLeap = false;
        for(i=1; i<13 && offset>0; i++) {
            if(lLeap>0 && i==(lLeap+1) && lIsLeap==false) { --i; lIsLeap=true; temp = (lunarInfo[lYear-1900] & 0x10000)? 30:29; }
            else { temp = (lunarInfo[lYear-1900] & (0x10000>>i))? 30:29; }
            if(lIsLeap==true && i==(lLeap+1)) lIsLeap=false; offset -= temp;
        }
        if(offset==0 && lLeap>0 && i==lLeap+1) { if(lIsLeap) lIsLeap=false; else { lIsLeap=true; --i; } }
        if(offset<0) { offset += temp; --i; }
        let lDay = offset + 1;
        if (lDay === 1) return (lIsLeap?"闰":"") + monthCn[i-1] + "月";
        return (lDay==10?"初十": lDay==20?"二十": lDay==30?"三十": ["初","十","廿","卅"][Math.floor(lDay/10)] + nStr1[lDay%10]);
    }
    
    const chineseHolidays = {
        '1-1': '元旦', '2-14': '情人节', '3-8': '妇女节', '3-12': '植树节',
        '5-1': '劳动节', '5-4': '青年节', '6-1': '儿童节', '7-1': '建党节',
        '8-1': '建军节', '9-10': '教师节', '10-1': '国庆节'
    };

    const solarTerms2025 = {'1-5': '小寒', '1-20': '大寒', '2-3': '立春', '2-18': '雨水', '3-5': '惊蛰', '3-20': '春分', '4-4': '清明', '4-20': '谷雨', '5-5': '立夏', '5-21': '小满', '6-5': '芒种', '6-21': '夏至', '7-7': '小暑', '7-22': '大暑', '8-7': '立秋', '8-23': '处暑', '9-7': '白露', '9-23': '秋分', '10-8': '寒露', '10-23': '霜降', '11-7': '立冬', '11-22': '小雪', '12-7': '大雪', '12-21': '冬至'};
    const solarTerms2026 = {'1-5': '小寒', '1-20': '大寒', '2-4': '立春', '2-18': '雨水', '3-5': '惊蛰', '3-20': '春分', '4-5': '清明', '4-20': '谷雨', '5-5': '立夏', '5-21': '小满', '6-5': '芒种', '6-21': '夏至', '7-7': '小暑', '7-23': '大暑', '8-7': '立秋', '8-23': '处暑', '9-7': '白露', '9-23': '秋分', '10-8': '寒露', '10-23': '霜降', '11-7': '立冬', '11-22': '小雪', '12-7': '大雪', '12-22': '冬至'};
    const solarTermsByYear = { 2025: solarTerms2025, 2026: solarTerms2026 };
    const workdayAdjustments2025 = {'1-26': 'work', '1-28': 'rest', '1-29': 'rest', '1-30': 'rest', '1-31': 'rest', '2-1': 'rest', '2-2': 'rest', '2-4': 'rest', '4-4': 'rest', '4-5': 'rest', '4-6': 'rest', '4-27': 'work', '5-1': 'rest', '5-2': 'rest', '5-3': 'rest', '5-4': 'rest', '5-5': 'rest', '5-31': 'rest', '6-1': 'rest', '6-2': 'rest', '9-28': 'work', '10-1': 'rest', '10-2': 'rest', '10-3': 'rest', '10-4': 'rest', '10-5': 'rest', '10-6': 'rest', '10-7': 'rest', '10-8': 'rest', '10-11': 'work'};
    const workdayAdjustments2026 = {'1-1': 'rest', '1-2': 'rest', '1-3': 'rest', '1-4': 'work', '2-14': 'work', '2-15': 'rest', '2-16': 'rest', '2-17': 'rest', '2-18': 'rest', '2-19': 'rest', '2-20': 'rest', '2-21': 'rest', '2-22': 'rest', '2-23': 'rest', '2-28': 'work', '4-4': 'rest', '4-5': 'rest', '4-6': 'rest', '5-1': 'rest', '5-2': 'rest', '5-3': 'rest', '5-4': 'rest', '5-5': 'rest', '5-9': 'work', '6-19': 'rest', '6-20': 'rest', '6-21': 'rest', '9-20': 'work', '9-25': 'rest', '9-26': 'rest', '9-27': 'rest', '10-1': 'rest', '10-2': 'rest', '10-3': 'rest', '10-4': 'rest', '10-5': 'rest', '10-6': 'rest', '10-7': 'rest', '10-10': 'work'};
    const workdayAdjustmentsByYear = { 2025: workdayAdjustments2025, 2026: workdayAdjustments2026 };

    document.addEventListener("DOMContentLoaded", () => {
        const calendar = document.getElementById("calendar");
        const startDaySelect = document.getElementById("startDay");
        const backgroundSelect = document.getElementById("background");
        const embedButton = document.getElementById("embedButton");
        const initialControls = document.getElementById("initial-controls");
        const monthDisplay = document.querySelector(".month-display");

        const today = new Date();
        let viewMonth = today.getMonth();
        let viewYear = today.getFullYear();

        function getWeekNo(date) {
            const firstDay = new Date(date.getFullYear(), 0, 1);
            return Math.ceil((((date - firstDay) / 86400000) + firstDay.getDay() + 1) / 7);
        }

        function render() {
            const startDay = parseInt(startDaySelect.value);
            const firstDayDate = new Date(viewYear, viewMonth, 1);
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

            monthDisplay.textContent = `${monthNames[viewMonth]} ${viewYear}`;
            let html = '<div class="calendar-grid">';
            const headers = startDay === 0 ? ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"] : ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
            headers.forEach(h => html += `<div class="calendar-header">${h}</div>`);
            html += '<div class="calendar-header">Week</div>';

            let firstIdx = firstDayDate.getDay();
            if (startDay === 1) firstIdx = (firstIdx === 0 ? 6 : firstIdx - 1);

            const lastDay = new Date(viewYear, viewMonth + 1, 0).getDate();
            const prevLastDay = new Date(viewYear, viewMonth, 0).getDate();
            let nextD = 1;
            const rowCount = Math.ceil((firstIdx + lastDay) / 7);

            for (let r = 0; r < rowCount; r++) {
                for (let c = 0; c < 7; c++) {
                    const i = r * 7 + c - firstIdx;
                    if (i < 0) {
                        html += `<div class="calendar-day other-month"><span class="day-number">${prevLastDay + i + 1}</span></div>`;
                    } else if (i >= lastDay) {
                        html += `<div class="calendar-day other-month"><span class="day-number">${nextD++}</span></div>`;
                    } else {
                        const curD = i + 1;
                        const curObj = new Date(viewYear, viewMonth, curD);
                        const mDK = `${viewMonth + 1}-${curD}`;

                        const hol = customData.holidays[mDK] || chineseHolidays[mDK] || null;
                        const sol = (solarTermsByYear[viewYear] || {})[mDK] || null;
                        const bdy = customData.birthdays[mDK] || null;
                        const adj = (workdayAdjustmentsByYear[viewYear] || {})[mDK] || null;

                        const isWE = (curObj.getDay() === 0 || curObj.getDay() === 6);
                        const isToday = (curD === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear());
                        const isPast = (curObj < new Date(today.getFullYear(), today.getMonth(), today.getDate()));

                        let cls = 'calendar-day' + (isToday ? ' today' : '') + (isPast ? ' past-day' : '') + (isWE && !adj ? ' weekend' : '');

                        html += `<div class="${cls}">`;
                        if(bdy) html += `<span class="birthday-icon" title="${bdy}">🎂</span>`;
                        if(adj === 'work') html += '<span class="work-badge">班</span>';
                        else if(adj === 'rest') html += '<span class="rest-badge">休</span>';

                        html += `<span class="day-number">${curD}</span>`;
                        // 有节日或节气时不显示农历
                        if (hol) html += `<span class="holiday-label">${hol}</span>`;
                        else if (sol) html += `<span class="solar-term">${sol}</span>`;
                        else html += `<span class="lunar-date">${getLunar(curObj)}</span>`;
                        html += '</div>';
                    }
                }
                const weekDate = new Date(viewYear, viewMonth, Math.max(1, (r * 7) - firstIdx + 1));
                html += `<div class="week-display">${getWeekNo(weekDate)}</div>`;
            }
            calendar.innerHTML = html + '</div>';

            // 背景色应用
            const bg = backgroundSelect.value;
            document.querySelectorAll('.calendar-day:not(.today):not(.weekend), .calendar-header, .week-display').forEach(el => el.style.backgroundColor = bg);
        }

        // Embed 只保存偏好，不保存特定的年月
        embedButton.addEventListener("click", () => {
            const url = new URL(window.location.origin + window.location.pathname);
            url.searchParams.set('startDay', startDaySelect.value);
            url.searchParams.set('bg', backgroundSelect.value);
            window.history.pushState({}, '', url.toString());

            navigator.clipboard.writeText(url.toString()).then(() => {
                initialControls.classList.add("hidden");
                alert('配置已保存！链接已复制到剪贴板。该链接将永远展示实时月份。');
            });
        });

        // 读入偏好
        const params = new URLSearchParams(window.location.search);
        if (params.has('startDay')) {
            startDaySelect.value = params.get('startDay');
            backgroundSelect.value = params.get('bg');
            initialControls.classList.add("hidden");
        }

        // 箭头切换临时月份
        document.querySelector(".prev").addEventListener("click", () => { viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} render(); });
        document.querySelector(".next").addEventListener("click", () => { viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} render(); });

        startDaySelect.addEventListener("change", render);
        backgroundSelect.addEventListener("change", render);

        render();
    });
</script>
</body>
</html>
