
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>全功能万年日历</title>

<style>
* { box-sizing: border-box; }

.calendar-container {
    max-width: 440px;
    margin: 15px auto;
    font-family: "Microsoft YaHei", Arial, sans-serif;
    font-size: 10px;
}

.controls {
    margin-bottom: 10px;
    display: flex;
    gap: 5px;
    align-items: center;
    flex-wrap: wrap;
}

select {
    font-size: 10px;
    padding: 2px;
}

.month-display {
    font-weight: bold;
    font-size: 15px;
    text-align: center;
    line-height: 32px;
    height: 32px;
    margin: 0;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr)) 36px;
    gap: 1px;
}

.calendar-header {
    padding: 3px 0;
    text-align: center;
    font-weight: bold;
    border: 1px solid #ccc;
    font-size: 10px;
}

.calendar-day {
    padding: 2px;
    text-align: center;
    border: 1px solid #ccc;
    min-height: 42px;
    line-height: 1.1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    position: relative;
}

.day-number {
    font-size: 13px;
    margin-bottom: 1px;
}

.lunar-date {
    font-size: 9px;
    color: #666;
}

.holiday-label {
    font-size: 9px;
    color: #ff4444;
    font-weight: bold;
}

.solar-term {
    font-size: 9px;
    color: #2196F3;
    font-weight: bold;
}

.work-badge, .rest-badge {
    position: absolute;
    top: 1px;
    right: 1px;
    color: white;
    font-size: 8px;
    padding: 0 2px;
    border-radius: 2px;
    font-weight: bold;
}

.work-badge { background-color: #ff9800; }
.rest-badge { background-color: #4CAF50; }

.birthday-icon {
    position: absolute;
    bottom: 3px;
    left: 3px;
    font-size: 16px;
    cursor: help;
}

.past-day {
    text-decoration: line-through;
    color: #bbb;
}

.other-month {
    color: #ccc;
    opacity: 0.5;
}

.today {
    font-weight: bold;
    background-color: #fffacd !important;
    border: 1px solid #ff9800;
}

.weekend { background-color: #fff0f0; }

.embed-button {
    padding: 4px 8px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    margin: 4px;
    font-size: 10px;
}

.arrow {
    font-size: 14px;
    cursor: pointer;
    user-select: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background-color: #f0f0f0;
}

#calendar-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 100px;
    margin-top: -30px;
    margin-bottom: 10px;
}

.hidden { display: none !important; }

.week-display {
    font-size: 11px;
    text-align: center;
    padding: 3px;
    border: 1px solid #ccc;
    line-height: 38px;
    color: #999;
}

.legend {
    margin: 15px auto;
    max-width: 440px;
    display: flex;
    gap: 12px;
    justify-content: center;
    font-size: 9px;
    flex-wrap: wrap;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
}

.legend-color {
    width: 10px;
    height: 10px;
    border-radius: 2px;
}

</style>
</head>

</div>

// 年度数据读取接口

function getYearCalendar(year) {

    return yearlyCalendarData[year] || {
        holidays: {},
        workdays: {}
    };

}



// ==================================================
// 4. 农历计算
// ==================================================
//
// 使用浏览器 Intl 原生 Chinese Calendar。
// 支持闰月、农历月份和日期。
// 现代 Chrome / Edge 均支持。
// ==================================================

const lunarFormatter = new Intl.DateTimeFormat(
    'zh-CN-u-ca-chinese',
    {
        month: 'long',
        day: 'numeric'
    }
);

function getLunarParts(date) {

    const parts = lunarFormatter.formatToParts(date);

    const month = parts.find(
        p => p.type === 'month'
    )?.value || '';

    const day = parts.find(
        p => p.type === 'day'
    )?.value || '';

    return { month, day };

}


// 判断农历节日

function getLunarHoliday(date) {

    const lunar = getLunarParts(date);

    const nextDate = new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate() + 1
    );

    const nextLunar = getLunarParts(nextDate);

    // 春节
    if (
        lunar.month === '正月' &&
        lunar.day === '初一'
    ) return '春节';

    // 元宵节
    if (
        lunar.month === '正月' &&
        lunar.day === '十五'
    ) return '元宵节';

    // 端午节
    if (
        lunar.month === '五月' &&
        lunar.day === '初五'
    ) return '端午节';

    // 七夕节
    if (
        lunar.month === '七月' &&
        lunar.day === '初七'
    ) return '七夕节';

    // 中秋节
    if (
        lunar.month === '八月' &&
        lunar.day === '十五'
    ) return '中秋节';

    // 重阳节
    if (
        lunar.month === '九月' &&
        lunar.day === '初九'
    ) return '重阳节';

    // 腊八节
    if (
        lunar.month === '腊月' &&
        lunar.day === '初八'
    ) return '腊八节';

    // 小年：北方腊月二十三，南方腊月二十四
    if (
        lunar.month === '腊月' &&
        (lunar.day === '廿三' || lunar.day === '廿四')
    ) return '小年';

    // 除夕：农历月份的最后一天
    if (
        lunar.month !== nextLunar.month &&
        (lunar.day === '廿九' || lunar.day === '三十')
    ) return '除夕';

    return null;

}



// ==================================================
// 5. 二十四节气自动计算
// ==================================================
//
// 使用常见的节气日期近似公式。
// 2025、2026保留原始日期作为校准。
// 其他年份使用公式计算，个别年份可能有一天误差。
// ==================================================

const solarTermNames = [
    '小寒', '大寒',
    '立春', '雨水',
    '惊蛰', '春分',
    '清明', '谷雨',
    '立夏', '小满',
    '芒种', '夏至',
    '小暑', '大暑',
    '立秋', '处暑',
    '白露', '秋分',
    '寒露', '霜降',
    '立冬', '小雪',
    '大雪', '冬至'
];

const solarTermConstants = {

    1900: [
        6.11, 20.84,
        4.6295, 19.4599,
        6.3826, 21.4155,
        5.59, 20.888,
        6.318, 21.86,
        6.5, 22.20,
        7.928, 23.65,
        8.35, 23.95,
        8.44, 23.822,
        9.098, 24.218,
        8.218, 23.08,
        7.9, 22.6
    ],

    2000: [
        5.4055, 20.12,
        3.87, 18.73,
        5.63, 20.646,
        4.81, 20.1,
        5.52, 21.04,
        5.678, 21.37,
        7.108, 22.83,
        7.5, 23.13,
        7.646, 23.042,
        8.318, 23.438,
        7.438, 22.36,
        7.18, 21.94
    ]

};


// 精确校准数据

const solarTermOverrides = {

    2025: {
        '1-5': '小寒',
        '1-20': '大寒',
        '2-3': '立春',
        '2-18': '雨水',
        '3-5': '惊蛰',

    },

    2026: {

        '1-20': '大寒',
        '2-4': '立春',
        '2-18': '雨水',
        '3-5': '惊蛰',
        '3-20': '春分',
        '4-5': '清明',
        '4-20': '谷雨',
        '5-5': '立夏',
        '5-21': '小满',
        '6-5': '芒种',
        '6-21': '夏至',
        '7-7': '小暑',
        '7-23': '大暑',
        '8-7': '立秋',
        '8-23': '处暑',
        '9-7': '白露',
        '9-23': '秋分',
        '10-8': '寒露',
        '10-23': '霜降',
        '11-7': '立冬',
        '11-22': '小雪',
        '12-22': '冬至'
    }

};


function getSolarTerms(year) {

    if (solarTermOverrides[year]) {
        return solarTermOverrides[year];
    }

    const result = {};

    const baseYear = year >= 2000 ? 2000 : 1900;

    if (year < 1901 || year > 2099) {
        return result;
    }

    const constants = solarTermConstants[baseYear];

    const shortYear = year % 100;

    solarTermNames.forEach((name, index) => {

        const month = Math.floor(index / 2) + 1;

        const day = Math.floor(
            shortYear * 0.2422 +
            constants[index] -
            Math.floor((shortYear - 1) / 4)
        );

        result[`${month}-${day}`] = name;

    });

    return result;

}



// ==================================================
// 6. 日期辅助函数
// ==================================================

function getWeekNo(date) {

    const firstDay = new Date(
        date.getFullYear(),
        0,
        1
    );

    return Math.ceil(
        (
            (date - firstDay) / 86400000 +
            firstDay.getDay() + 1
        ) / 7
    );

}


function getDateKey(date) {

    return `${date.getMonth() + 1}-${date.getDate()}`;

}



// ==================================================
// 7. 日历主体
// ==================================================

document.addEventListener("DOMContentLoaded", () => {

    const calendar = document.getElementById("calendar");

    const startDaySelect = document.getElementById("startDay");

    const backgroundSelect = document.getElementById("background");

    const embedButton = document.getElementById("embedButton");

    const initialControls = document.getElementById("initial-controls");

    const monthDisplay = document.querySelector(".month-display");

    const today = new Date();

    const todayDate = new Date(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
    );

    let viewMonth = today.getMonth();

    let viewYear = today.getFullYear();


    // ---------------- 渲染 ----------------

    function render() {

        const startDay = parseInt(startDaySelect.value);

        const firstDayDate = new Date(
            viewYear,
            viewMonth,
            1
        );

        const monthNames = [
            "January", "February", "March",
            "April", "May", "June",
            "July", "August", "September",
            "October", "November", "December"
        ];

        monthDisplay.textContent =
            `${monthNames[viewMonth]} ${viewYear}`;


        // 读取当前年份的数据

        const yearData = getYearCalendar(viewYear);

        const solarTerms = getSolarTerms(viewYear);


        let html = '<div class="calendar-grid">';

        const headers = startDay === 0
            ? ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"]
            : ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];


        headers.forEach(h => {

            html += `<div class="calendar-header">${h}</div>`;

        });

        html += '<div class="calendar-header">Week</div>';


        let firstIdx = firstDayDate.getDay();

        if (startDay === 1) {

            firstIdx = firstIdx === 0
                ? 6
                : firstIdx - 1;

        }


        const lastDay = new Date(
            viewYear,
            viewMonth + 1,
            0
        ).getDate();

        const prevLastDay = new Date(
            viewYear,
            viewMonth,
            0
        ).getDate();

        const rowCount = Math.ceil(
            (firstIdx + lastDay) / 7
        );


        // ---------------- 每一周 ----------------

        for (let r = 0; r < rowCount; r++) {

            for (let c = 0; c < 7; c++) {

                const i = r * 7 + c - firstIdx;


                // 上个月

                if (i < 0) {

                    html += `
                        <div class="calendar-day other-month">
                            <span class="day-number">
                                ${prevLastDay + i + 1}
                            </span>
                        </div>
                    `;

                }


                // 下个月

                else if (i >= lastDay) {

                    html += `
                        <div class="calendar-day other-month">
                            <span class="day-number">
                                ${i - lastDay + 1}
                            </span>
                        </div>
                    `;

                }


                // 当前月份

                else {

                    const curD = i + 1;

                    const curObj = new Date(
                        viewYear,
                        viewMonth,
                        curD
                    );

                    const mDK = getDateKey(curObj);


                    // 获取各种数据

                    const customHoliday =
                        yearData.holidays[mDK] || null;

                    const fixedHoliday =
                        chineseHolidays[mDK] || null;

                    const lunarHoliday =
                        getLunarHoliday(curObj);

                    const hol =
                        customHoliday ||
                        lunarHoliday ||
                        fixedHoliday;


                    const sol =
                        solarTerms[mDK] || null;

                    const bdy =
                        customData.birthdays[mDK] || null;

                    const adj =
                        yearData.workdays[mDK] || null;


                    // 日期状态

                    const isWE =
                        curObj.getDay() === 0 ||
                        curObj.getDay() === 6;

                    const isToday =
                        curD === today.getDate() &&
                        viewMonth === today.getMonth() &&
                        viewYear === today.getFullYear();

                    const isPast = curObj < todayDate;


                    let cls = 'calendar-day';

                    if (isToday) cls += ' today';

                    if (isPast) cls += ' past-day';

                    if (isWE && !adj) cls += ' weekend';


                    html += `<div class="${cls}">`;


                    // 生日

                    if (bdy) {

                        html += `
                            <span
                                class="birthday-icon"
                                title="${bdy}"
                            >🎂</span>
                        `;

                    }


                    // 调休状态

                    if (adj === 'work') {

                        html += '<span class="work-badge">班</span>';

                    } else if (adj === 'rest') {

                        html += '<span class="rest-badge">休</span>';

                    }


                    // 日期数字

                    html += `
                        <span class="day-number">${curD}</span>
                    `;


                    // 节日优先于节气，节气优先于农历

                    if (hol) {

                        html += `
                            <span class="holiday-label">${hol}</span>
                        `;

                    } else if (sol) {

                        html += `
                            <span class="solar-term">${sol}</span>
                        `;

                    } else {

                        const lunar = getLunarParts(curObj);

                        html += `
                            <span class="lunar-date">
                                ${lunar.month === '正月' && lunar.day === '初一'
                                    ? '春节'
                                    : lunar.day}
                            </span>
                        `;

                    }


                    html += '</div>';

                }

            }


            // 周数

            const weekDate = new Date(
                viewYear,
                viewMonth,
                Math.max(
                    1,
                    r * 7 - firstIdx + 1
                )
            );

            html += `
                <div class="week-display">
                    ${getWeekNo(weekDate)}
                </div>
            `;

        }


        calendar.innerHTML = html + '</div>';


        // ---------------- 背景颜色 ----------------

        const bg = backgroundSelect.value;

        document.querySelectorAll(
            '.calendar-day:not(.today):not(.weekend), .calendar-header, .week-display'
        ).forEach(el => {

            el.style.backgroundColor = bg;

        });

    }



    // ==================================================
    // 8. Embed 功能
    // ==================================================

    embedButton.addEventListener("click", async () => {

        const url = new URL(
            window.location.href
        );

        url.searchParams.set(
            'startDay',
            startDaySelect.value
        );

        url.searchParams.set(
            'bg',
            backgroundSelect.value
        );

        url.searchParams.delete('year');
        url.searchParams.delete('month');

        try {

            await navigator.clipboard.writeText(
                url.toString()
            );

            window.history.pushState(
                {},
                '',
                url.toString()
            );

            initialControls.classList.add("hidden");

            alert(
                '配置已保存！链接已复制到剪贴板。该链接将始终展示实时月份。'
            );

        } catch (error) {

            alert(
                '复制失败，请检查浏览器剪贴板权限。'
            );

        }

    });



    // ==================================================
    // 9. 读取 Embed 参数
    // ==================================================

    const params = new URLSearchParams(
        window.location.search
    );

    if (params.has('startDay')) {

        const start = params.get('startDay');

        if (start === '0' || start === '1') {
            startDaySelect.value = start;
        }

        const bg = params.get('bg');

        const validBackgrounds = [
            '#ffffff',
            '#f0f8ff',
            '#f5f5dc',
            '#e6ffe6',
            '#e6e6fa'
        ];

        if (validBackgrounds.includes(bg)) {
            backgroundSelect.value = bg;
        }

        initialControls.classList.add("hidden");

    }



    // ==================================================
    // 10. 月份切换
    // ==================================================

    document.querySelector(".prev").addEventListener(
        "click",
        () => {

            viewMonth--;

            if (viewMonth < 0) {

                viewMonth = 11;

                viewYear--;

            }

            render();

        }
    );


    document.querySelector(".next").addEventListener(
        "click",
        () => {

            viewMonth++;

            if (viewMonth > 11) {

                viewMonth = 0;

                viewYear++;

            }

            render();

        }
    );


    // 星期起始日

    startDaySelect.addEventListener(
        "change",
        render
    );


    // 背景颜色

    backgroundSelect.addEventListener(
        "change",
        render
    );


    // 初始化

    render();

});

</script>

</body>
</html>
